name: devenv

services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: devenv:latest
    container_name: devenv
    hostname: dev

    stdin_open: true
    tty: true

    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

    environment:
      # API keys (from host env or docker/.env)
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"

      # Personal git identity (bootstrap.sh writes ~/.gitconfig.local from these)
      GIT_USER_NAME: "${GIT_USER_NAME:-}"
      GIT_USER_EMAIL: "${GIT_USER_EMAIL:-}"

      # Terminal / locale / timezone
      TERM: xterm-256color
      COLORTERM: truecolor
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      TZ: Asia/Tokyo

      # SSH agent forwarding
      SSH_AUTH_SOCK: /run/ssh-agent.sock

    volumes:
      # Entire home in one named volume: tool binaries, auth state, shell
      # history, plugins — everything survives container re-creation and
      # image rebuilds. `docker compose down -v` is a full factory reset.
      - home:/home/dev

      # Workspace (bind mount from the Windows host)
      - type: bind
        source: "${WORKSPACE_ROOT:-~/workspace}"
        target: /home/dev/workspace

      # SSH directory (read-only)
      - type: bind
        source: "${HOME:-${USERPROFILE}}/.ssh"
        target: /home/dev/.ssh
        read_only: true

      # GitHub Copilot config (read-only)
      - type: bind
        source: "${HOME:-${USERPROFILE}}/.config/github-copilot"
        target: /home/dev/.config/github-copilot
        read_only: true

      # SSH agent socket
      - type: bind
        source: "${SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}"
        target: /run/ssh-agent.sock
        read_only: true

      # Docker socket (DooD)
      - /var/run/docker.sock:/var/run/docker.sock

      # Entrypoint / bootstrap scripts (bind mounts: edits take effect on
      # `docker restart devenv`, no image rebuild needed)
      - type: bind
        source: ./entrypoint.sh
        target: /usr/local/bin/docker-entrypoint.sh
        read_only: true
      - type: bind
        source: ./bootstrap.sh
        target: /usr/local/bin/devenv-bootstrap.sh
        read_only: true

    working_dir: /home/dev/workspace

    # Auto-restart after Rancher Desktop / Windows restarts. Safe because all
    # state lives in the home volume.
    restart: unless-stopped

    user: "0:0"  # entrypoint fixes ownership, then drops to dev
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["su", "-", "dev", "-c", "zsh"]

volumes:
  home:
